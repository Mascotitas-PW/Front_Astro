name: Front CI/CD
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read, pages: write, id-token: write }

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_GRAPHQL_URL: ${{ vars.PUBLIC_GRAPHQL_URL }}
          PUBLIC_MP_KEY: ${{ vars.PUBLIC_MP_KEY }}
          PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.PUBLIC_GOOGLE_CLIENT_ID }}
          PUBLIC_GOOGLE_MAPS_KEY: ${{ vars.PUBLIC_GOOGLE_MAPS_KEY }}
          PUBLIC_PAYPAL_CLIENT_ID: ${{ vars.PUBLIC_PAYPAL_CLIENT_ID }}
          PUBLIC_PAYPAL_ENVIRONMENT: ${{ vars.PUBLIC_PAYPAL_ENVIRONMENT }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
