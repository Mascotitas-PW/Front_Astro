name: Deploy Astro site to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_GRAPHQL_URL: ${{ vars.VITE_GRAPHQL_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GraphQL endpoint
        run: |
          case "$VITE_GRAPHQL_URL" in
            https://*) ;;
            *) echo "::error::Set the VITE_GRAPHQL_URL repository variable to the public HTTPS GraphQL endpoint."; exit 1 ;;
          esac

      - name: Install, build, and upload Site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4