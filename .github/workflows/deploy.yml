name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install, build, and upload site
        uses: withastro/action@v3
        env:
          PUBLIC_MP_KEY: ${{ vars.PUBLIC_MP_KEY }}
          PUBLIC_PAYPAL_CLIENT_ID: ${{ vars.PUBLIC_PAYPAL_CLIENT_ID }}
          PUBLIC_PAYPAL_API_URL: ${{ vars.PUBLIC_PAYPAL_API_URL }}
          PUBLIC_PAYPAL_ENVIRONMENT: ${{ vars.PUBLIC_PAYPAL_ENVIRONMENT }}
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4